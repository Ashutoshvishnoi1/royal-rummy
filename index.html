function initializeFirebase(){try{if(typeof firebase==="undefined")throw Error("Firebase scripts did not load. Check internet.");if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);db=firebase.database();firebase.auth().signInAnonymously().then(r=>{uid=r.user.uid;ready=true;el("loading").style.display="none";clearError();screen("home");msg("homeMessage","Firebase connected. Create or join a room.")}).catch(e=>{el("loading").textContent="Firebase sign-in failed.";error((e.code?e.code+": ":"")+e.message)})}catch(e){el("loading").textContent="Firebase could not start.";error(e.message)}}

function drawCard(source){if(!currentRoom||!currentCode)return;db.ref("rooms/"+currentCode).transaction(r=>{if(!r||!r.game||r.game.finished)return;let g=r.game;if(g.turnUid!==uid||g.phase!=="draw")return;if(!g.hands)g.hands={};if(!g.hands[uid])g.hands[uid]=[];if(!g.deck)g.deck=[];if(!g.discard)g.discard=[];if(source==="discard"){if(!g.discard.length)return;g.hands[uid].push(g.discard.pop())}else{if(!g.deck.length&&g.discard.length>1){let top=g.discard.pop();g.deck=shuffled(g.discard);g.discard=[top]}if(!g.deck.length)return;g.hands[uid].push(g.deck.pop())}g.phase="discard";return r}).then(res=>{if(!res.committed)msg("gameMessage","You cannot draw now.")}).catch(e=>error("Draw failed: "+e.message))}
function toggleAutoSort(){autoSort=!autoSort;selectedIndex=-1;renderGame()}function selectCard(i){let h=myHand();if(i<0||i>=h.length)return;selectedIndex=i;renderGame()}
function discardCard(){if(!currentRoom||!currentCode)return;let hand=myHand();if(selectedIndex<0||selectedIndex>=hand.length){msg("handMessage","Select a card first.");return}let selectedId=hand[selectedIndex].id;db.ref("rooms/"+currentCode).transaction(r=>{if(!r||!r.game||r.game.finished)return;let g=r.game;if(g.turnUid!==uid||g.phase!=="discard"||!g.hands||!g.hands[uid])return;let h=g.hands[uid],idx=h.findIndex(c=>c.id===selectedId);if(idx<0)return;g.discard=g.discard||[];g.discard.push(h.splice(idx,1)[0]);let order=g.turnOrder||[],pos=order.indexOf(uid);if(pos<0||!order.length)return;g.turnUid=order[(pos+1)%order.length];g.phase="draw";return r}).then(res=>{if(res.committed){selectedIndex=-1;msg("handMessage","Card discarded.")}else msg("handMessage","Discard failed. Check your turn.")}).catch(e=>error("Discard failed: "+e.message))}

function declareHand(){let g=gameData();if(!g||g.finished)return;if(g.turnUid!==uid||g.phase!=="draw"){msg("handMessage","Declare on your turn when you hold 13 cards.");return}let result=validateHand(myHand(),g.wildRank);if(!result.valid&&!confirm("Your hand is invalid. A wrong declaration gives you 80 penalty points. Continue?"))return;db.ref("rooms/"+currentCode).transaction(r=>{if(!r||!r.game||r.game.finished)return;let game=r.game;if(game.turnUid!==uid||game.phase!=="draw"||!game.hands||!game.hands[uid])return;let check=validateHand(game.hands[uid],game.wildRank),name=(r.players[uid]&&r.players[uid].name)||"Player";game.finished=true;game.winnerUid=check.valid?uid:null;game.scores=scoreAll(game,check.valid?uid:null,check.valid?null:uid);game.resultText=check.valid?name+" wins with a valid declaration!":name+" made an invalid declaration. Penalty: 80 points.";return r}).then(res=>{if(!res.committed)msg("handMessage","Could not declare. Check the current turn.")}).catch(e=>error("Declare failed: "+e.message))}

function renderRoom(){if(!currentRoom)return;el("roomCodeDisplay").textContent=currentCode||currentRoom.code||"------";let list=el("playerList");list.innerHTML="";ids(currentRoom).forEach(id=>{let p=currentRoom.players[id]||{},row=document.createElement("div");row.className="player";let n=document.createElement("span");n.textContent=p.name||"Player";let tag=document.createElement("small");tag.textContent=(id===currentRoom.hostUid?"Host ":"")+(id===uid?"• You ":"")+(p.isTest?"• Test":"");row.append(n,tag);list.appendChild(row)});if(currentRoom.game&&currentRoom.game.started){screen("game");renderGame()}else{screen("lobby");el("startButton").disabled=currentRoom.hostUid!==uid;msg("lobbyMessage",ids(currentRoom).length+" player(s). At least 2 required.")}}

function renderGame(){let g=gameData();if(!g)return;let hand=myHand(),mine=myTurn(g)&&!g.finished;el("gameRoomCode").textContent=currentCode||"";el("wildRank").textContent=getWild(g);el("deckCount").textContent=(g.deck||[]).length;let top=(g.discard||[]).slice(-1)[0];el("discardPile").innerHTML="";if(top){let span=document.createElement("span");span.innerHTML=top.printedJoker?"★ JOKER":safe(top.rank)+"<br>"+safe(top.symbol);if(top.red)span.style.color="#c52232";el("discardPile").appendChild(span)}else el("discardPile").textContent="Empty";let canDraw=mine&&g.phase==="draw",canDiscard=mine&&g.phase==="discard";el("drawDeckButton").disabled=!canDraw||g.finished;el("drawDiscardButton").disabled=!canDraw||!(g.discard||[]).length||g.finished;el("discardButton").disabled=!canDiscard||selectedIndex<0||g.finished;el("declareButton").disabled=!canDraw||g.finished;el("sortState").textContent=autoSort?"ON":"OFF";if(g.finished)msg("gameMessage",g.resultText||"Game finished.");else if(mine)msg("gameMessage",g.phase==="draw"?"Your turn: draw a card or declare.":"Your turn: select one card and discard.");else{let next=currentRoom.players[g.turnUid];msg("gameMessage","Waiting for "+(next?next.name:"the next player")+".")}
let opponents=el("opponentList");opponents.innerHTML="";ids(currentRoom).forEach(id=>{let p=currentRoom.players[id]||{},row=document.createElement("div");row.className="player";let name=document.createElement("span");name.textContent=(p.name||"Player")+(id===uid?" (You)":"");let count=g.hands&&g.hands[id]?g.hands[id].length:0,tag=document.createElement("small");tag.textContent=(g.turnUid===id&&!g.finished?"Their turn • ":"")+count+" cards";row.append(name,tag);opponents.appendChild(row)});let handNode=el("hand");handNode.innerHTML="";displayedHand(hand).forEach(item=>{let c=item.card,b=document.createElement("button");b.className="card"+(c.red?" red":"")+(isWild(c,g.wildRank)?" joker":"")+(selectedIndex===item.index?" selected":"");b.innerHTML=c.printedJoker?"★<span class='suit'>JOKER</span>":safe(c.rank)+"<span class='suit'>"+safe(c.symbol)+"</span>";b.disabled=!canDiscard;b.onclick=()=>selectCard(item.index);handNode.appendChild(b)});if(!canDiscard)msg("handMessage","Your hand: "+hand.length+" cards.");else msg("handMessage",selectedIndex>=0?"Card selected. Press Discard.":"Select a card to discard.");let resultBox=el("resultBox");resultBox.innerHTML="";if(g.finished){let result=document.createElement("div");result.className="panel";result.innerHTML="<h3>Game Result</h3><p>"+safe(g.resultText)+"</p><h3>Scores</h3>";ids(currentRoom).forEach(id=>{let p=currentRoom.players[id]||{},line=document.createElement("p");line.textContent=(p.name||"Player")+": "+((g.scores&&g.scores[id])||0)+" points";result.appendChild(line)});resultBox.appendChild(result)}maybeAutoTest()}
function maybeAutoTest(){if(botBusy||!currentRoom||!currentCode)return;let g=gameData();if(!g||!g.started||g.finished||g.phase!=="draw")return;let bot=g.turnUid;if(!bot||!bot.startsWith("test_"))return;botBusy=true;let code=currentCode;setTimeout(()=>{db.ref("rooms/"+code).transaction(r=>{if(!r||!r.game||r.game.finished)return;let game=r.game;if(game.turnUid!==bot||game.phase!=="draw")return;game.hands=game.hands||{};game.hands[bot]=game.hands[bot]||[];game.deck=game.deck||[];game.discard=game.discard||[];if(!game.deck.length&&game.discard.length>1){let top=game.discard.pop();game.deck=shuffled(game.discard);game.discard=[top]}if(game.deck.length)game.hands[bot].push(game.deck.pop());else if(game.discard.length)game.hands[bot].push(game.discard.pop());else return;let h=game.hands[bot];if(h.length){let idx=Math.floor(Math.random()*h.length);game.discard.push(h.splice(idx,1)[0])}if(validateHand(h,game.wildRank).valid){game.finished=true;game.winnerUid=bot;game.resultText=((r.players[bot]&&r.players[bot].name)||"Test Player")+" wins with a valid hand!";game.scores=scoreAll(game,bot,null);return r}let order=game.turnOrder||[],pos=order.indexOf(bot);if(pos<0||!order.length)return;game.turnUid=order[(pos+1)%order.length];game.phase="draw";return r}).catch(e=>error("Test Player error: "+e.message)).finally(()=>{botBusy=false})},1000)}
